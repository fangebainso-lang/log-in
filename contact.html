<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Contact Us - My Shop</title>
    <style>
        /* Body styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }

        /* Header / Navigation */
        header {
            background-color: #FFF8E1; /* Blue header */
            color: rgb(240, 35, 35);
            padding: 20px;
            text-align: center;
        }
        nav a {
            color: rgb(75, 73, 73);
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        /* Main content */
        main {
            max-width: 600px;
            margin: 50px auto;
            background-color: #E3F2FD;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #fc2494; /* Blue section headers */
            text-align: center;
        }
        label {
            display: block;
            margin: 15px 0 5px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #ff6600; /* Orange button */
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #e65c00;
        }

    </style>
</head>
<body>
    <header>
        <h1>My Shop</h1>
        <nav>
            <a href="home.html">Home</a>
            <a href="#">Products</a>
            <a href="#">Cart</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Login Form</h2>
        <form id="contactForm">
            <label for="name">Name</label>
            <input type="text" id="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="message">Message</label>
            <textarea id="message" rows="5" required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </main>

    <!-- Footer -->
    <footer style="background-color: #FF69B4; padding: 20px 0; text-align: center;">
    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <h4>Contact Us</h4>
                <p>Email: contact@hairwebsite.com<br> Phone: (123) 456-7890<br> Address: 123 Hair St, Style City, ST 12345</p>
            </div>
            <div class="col-md-4">
                <h4>Quick Links</h4>
                <ul style="list-style-type: none; padding: 0;">
                    <li><a href="#" style="text-decoration: none; color: #333;">Home</a></li>
                    <li><a href="#" style="text-decoration: none; color: #333;">About Us</a></li>
                    <li><a href="#" style="text-decoration: none; color: #333;">Services</a></li>
                    <li><a href="#" style="text-decoration: none; color: #333;">Gallery</a></li>
                    <li><a href="#" style="text-decoration: none; color: #333;">Contact</a></li>
                </ul>
            </div>
            <div class="col-md-4">
                <h4>Subscribe</h4>
                <form action="#" method="post">
                    <input type="email" placeholder="Enter your email..." required style="padding: 10px; width: 80%; margin-bottom: 5px;"/><br>
                    <button type="submit" style="padding: 10px 15px;">Subscribe</button>
                </form>
                <div style="margin-top: 10px;">
                    <a href="#"><img src="facebook-icon.png" alt="Facebook" style="width: 24px; margin: 0 5px;"></a>
                    <a href="#"><img src="instagram-icon.png" alt="Instagram" style="width: 24px; margin: 0 5px;"></a>
                    <a href="#"><img src="twitter-icon.png" alt="Twitter" style="width: 24px; margin: 0 5px;"></a>
                </div>
            </div>
        </div>
        <div style="margin-top: 20px;">
            <p>&copy; 2026 Hair Website. All Rights Reserved.</p>
        </div>
    </div>
</footer>

    <script>
        // Simple JavaScript to handle contact form submission
        document.getElementById('contactForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;

            if(name && email && message) {
                alert("Thank you " + name + "! Your message has been sent.");
                document.getElementById('contactForm').reset();
            } else {
                alert("Please fill out all fields before submitting.");
            }
        });
    </script>
</head>
<body>
    
</body>
</html>
